{{define "title"}}LNDg - Reset{{end}}
{{define "content"}}
<div class="w3-container w3-padding-small">
  <center><h1>Reset Data</h1></center>
  <table id="resetTable" class="w3-table-all w3-centered w3-hoverable">
    <tr>
      <th>Table</th>
      <th>Records</th>
      <th>Action</th>
    </tr>
    {{range .tables}}
    <tr>
      <td>{{.name}}</td>
      <td>{{.count | intcomma}}</td>
      <td>
        <button onclick="window.confirm('Are you sure you want to delete all the records in the {{.name}} table?') ? (POST('reset', {body:{'table':'{{.name}}'}}), this.parentElement.parentElement.cells[1].innerHTML=0) : ''">Delete</button>
      </td>
    </tr>
    {{end}}
  </table>
</div>
{{end}}
