version: v2
# go_package pro Datei auf unser Modul umgeschrieben (Original: lightningnetwork/lnd).
managed:
  enabled: true
  override:
    - file_option: go_package
      path: lightning.proto
      value: github.com/warioishere/lndg-blitz-go/internal/lnd/lnrpc
    - file_option: go_package
      path: routerrpc/router.proto
      value: github.com/warioishere/lndg-blitz-go/internal/lnd/lnrpc/routerrpc
    - file_option: go_package
      path: signrpc/signer.proto
      value: github.com/warioishere/lndg-blitz-go/internal/lnd/lnrpc/signrpc
    - file_option: go_package
      path: walletrpc/walletkit.proto
      value: github.com/warioishere/lndg-blitz-go/internal/lnd/lnrpc/walletrpc
    - file_option: go_package
      path: wtclientrpc/wtclient.proto
      value: github.com/warioishere/lndg-blitz-go/internal/lnd/lnrpc/wtclientrpc
plugins:
  - local: protoc-gen-go
    out: ../../internal/lnd/lnrpc
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../../internal/lnd/lnrpc
    opt: paths=source_relative
