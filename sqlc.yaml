version: "2"
sql:
  - engine: "postgresql"
    # Schema: nur die up-Migration (die down-Datei wuerde alle Tabellen wieder
    # droppen und sqlc ein leeres Schema liefern).
    schema: "internal/db/migrations/000001_initial_schema.up.sql"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
