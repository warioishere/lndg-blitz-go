version: "2"
sql:
  - engine: "postgresql"
    # Schema: nur die up-Migration (die down-Datei wuerde alle Tabellen wieder
    # droppen und sqlc ein leeres Schema liefern).
    schema:
      - "internal/db/migrations/000001_initial_schema.up.sql"
      - "internal/db/migrations/000002_payments_source_fee_rate.up.sql"
      - "internal/db/migrations/000003_shadow_fee_log.up.sql"
      - "internal/db/migrations/000004_graphprobelog_via.up.sql"
      - "internal/db/migrations/000005_route_evidence.up.sql"
      - "internal/db/migrations/000006_route_combination.up.sql"
      - "internal/db/migrations/000007_market_policy.up.sql"
      - "internal/db/migrations/000008_nk_fee_mode.up.sql"
      - "internal/db/migrations/000009_nk_budget_always.up.sql"
      - "internal/db/migrations/000010_route_attempt_hops.up.sql"
      - "internal/db/migrations/000011_route_attempt_duration.up.sql"
      - "internal/db/migrations/000012_scout_path.up.sql"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
